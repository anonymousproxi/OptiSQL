# Tiny end-to-end check: a 0.5B model, a handful of examples, a few steps, any device.
# It proves the pipeline runs. Its numbers mean nothing and are never reported.
run_name = "smoke"
model_name = "Qwen/Qwen2.5-Coder-0.5B-Instruct"
backend = "plain"
load_in_4bit = false
precision = "fp32"
optim = "adamw_torch"
gradient_checkpointing = false

max_seq_length = 1024
max_train_examples = 16
max_val_examples = 8
max_steps = 3
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
gradient_accumulation_steps = 2
logging_steps = 1
eval_steps = 2
save_steps = 2
save_total_limit = 1
